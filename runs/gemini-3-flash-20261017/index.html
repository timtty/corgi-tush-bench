<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corgi Bum - Interactive 3D Model</title>
    <meta name="description" content="A realistic, interactive 3D model of a Pembroke Welsh Corgi rump with procedural fur and wiggles.">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f5f5f5; }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Seeded Random Number Generator ---
        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        const params = new URLSearchParams(window.location.hash.slice(1));
        let seedVal = params.get('seed');
        if (seedVal === null) seedVal = Math.floor(Math.random() * 1000000);
        else seedVal = parseInt(seedVal) || 0;
        
        const rand = mulberry32(seedVal);
        const coatOverride = params.get('coat');

        // --- Corgi Coat Data ---
        const COLORS = {
            red: { main: 0xc46b2d, pants: 0xfafafa, legs: 0xfafafa, tan: 0xd88a4a },
            sable: { main: 0x8b5a2b, pants: 0xf0f0f0, legs: 0xfafafa, tan: 0xb5733e },
            tri: { main: 0x1a1a1a, pants: 0xfafafa, legs: 0xfafafa, tan: 0xb5733e },
            bht: { main: 0x050505, pants: 0xfafafa, legs: 0xfafafa, tan: 0x9a6335 }
        };
        const COAT_TYPES = ['red', 'sable', 'tri', 'bht'];
        const selectedCoat = (coatOverride && COLORS[coatOverride]) ? coatOverride : COAT_TYPES[Math.floor(rand() * COAT_TYPES.length)];
        const coatData = COLORS[selectedCoat];

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 3.5);
        window.camera = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        window.controls = controls;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;
        controls.minPolarAngle = THREE.MathUtils.degToRad(20);
        controls.maxPolarAngle = THREE.MathUtils.degToRad(87);
        controls.target.set(0, 0.5, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        scene.add(dirLight);

        // --- Ground ---
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.ShadowMaterial({ opacity: 0.15 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Fur Shaders ---
        const furVertexShader = `
            uniform float uShellIndex;
            uniform float uShellCount;
            uniform float uShellThickness;
            uniform float uTime;
            uniform float uWiggle;

            varying vec2 vUv;
            varying float vHeight;
            varying vec3 vPosition;

            void main() {
                vUv = uv;
                vHeight = uShellIndex / uShellCount;
                
                vec3 pos = position;
                float h = vHeight * uShellThickness;
                
                // Extra fluff for corgi pants
                float isPants = smoothstep(0.0, 0.7, position.z) * smoothstep(0.5, -0.4, position.y);
                h *= (1.0 + isPants * 0.9);

                pos += normal * h;
                
                // Secondary jiggle motion
                float lateral = sin(uTime * 12.0 + position.z * 4.0) * uWiggle * vHeight * 0.12;
                pos.x += lateral;

                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const furFragmentShader = `
            uniform float uShellIndex;
            uniform float uShellCount;
            uniform vec3 uBaseColor;
            uniform vec3 uPantsColor;
            uniform vec3 uTanColor;
            uniform int uCoatType;
            uniform float uSeed;

            varying vec2 vUv;
            varying float vHeight;
            varying vec3 vPosition;

            float hash(vec2 p) {
                p = fract(p * vec2(123.34 + uSeed, 456.21 + uSeed));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            void main() {
                float noise = hash(vUv * 600.0);
                if (noise < vHeight) discard;

                vec3 color = uBaseColor;
                
                // Corgi-specific markings: White pants and belly
                float pantsMask = smoothstep(0.1, 0.5, vPosition.z) * smoothstep(0.4, -0.3, vPosition.y);
                float bellyMask = smoothstep(0.2, -0.7, vPosition.y) * smoothstep(0.5, -0.5, vPosition.z);
                float isPants = max(pantsMask, bellyMask);
                
                // Tan markings for tricolor variants
                float isTan = 0.0;
                if (uCoatType >= 2) {
                    isTan = smoothstep(0.7, 0.3, abs(vPosition.x)) * smoothstep(0.2, 0.8, vPosition.z) * smoothstep(-0.3, 0.5, vPosition.y);
                }
                
                // Sable darkening on hair tips
                if (uCoatType == 1) { 
                    float tips = smoothstep(0.4, 1.0, vHeight);
                    color = mix(color, vec3(0.05), tips * 0.4);
                }

                color = mix(color, uTanColor, isTan);
                color = mix(color, uPantsColor, isPants);
                
                // Soft shading
                color *= (0.4 + 0.6 * vHeight);
                float alpha = 1.0 - smoothstep(0.85, 1.0, vHeight);
                gl_FragColor = vec4(color, alpha);
            }
        `;

        const allFurMaterials = [];

        function createShells(geometry, targetMesh, isLeg = false, isTail = false) {
            const count = isLeg ? 10 : 32;
            const thick = isLeg ? 0.05 : 0.22;
            for (let i = 0; i < count; i++) {
                const mat = new THREE.ShaderMaterial({
                    uniforms: {
                        uShellIndex: { value: i },
                        uShellCount: { value: count },
                        uShellThickness: { value: thick },
                        uBaseColor: { value: new THREE.Color(isLeg ? coatData.legs : (isTail ? coatData.pants : coatData.main)) },
                        uPantsColor: { value: new THREE.Color(coatData.pants) },
                        uTanColor: { value: new THREE.Color(coatData.tan) },
                        uTime: { value: 0 },
                        uWiggle: { value: 0 },
                        uCoatType: { value: COAT_TYPES.indexOf(selectedCoat) },
                        uSeed: { value: rand() }
                    },
                    vertexShader: furVertexShader,
                    fragmentShader: furFragmentShader,
                    transparent: true,
                    side: THREE.DoubleSide
                });
                allFurMaterials.push(mat);
                const shell = new THREE.Mesh(geometry, mat);
                targetMesh.add(shell);
            }
        }

        // --- Corgi Body ---
        const corgiGroup = new THREE.Group();
        scene.add(corgiGroup);

        const bodyGeo = new THREE.SphereGeometry(1, 40, 40);
        const bodyV = bodyGeo.attributes.position.array;
        for (let i = 0; i < bodyV.length; i += 3) {
            bodyV[i] *= 0.85; bodyV[i+1] *= 0.72; bodyV[i+2] *= 1.25; // Loaf proportions
            if (bodyV[i+2] > 0) { // Heart-shaped rump
                bodyV[i+1] -= 0.12 * Math.sin(Math.abs(bodyV[i]) * 3) * bodyV[i+2];
                bodyV[i] += (bodyV[i] > 0 ? 0.06 : -0.06) * bodyV[i+2];
            }
            if (bodyV[i+2] < -0.8) { // Fade out front
                const s = 1 + (bodyV[i+2] + 0.8);
                bodyV[i] *= s; bodyV[i+1] *= s;
            }
        }
        bodyGeo.computeVertexNormals();
        const bodyMat = new THREE.MeshStandardMaterial({ color: coatData.main });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.7;
        body.castShadow = true;
        corgiGroup.add(body);
        createShells(bodyGeo, body);

        // Tail Stub
        const tailGeo = new THREE.SphereGeometry(0.18, 12, 12);
        const tail = new THREE.Mesh(tailGeo, new THREE.MeshStandardMaterial({ color: coatData.pants }));
        tail.scale.set(1, 0.8, 1.4);
        tail.position.set(0, 0.82, 1.1);
        corgiGroup.add(tail);
        createShells(tailGeo, tail, false, true);

        // Hind Legs
        function createLeg(x, z) {
            const group = new THREE.Group();
            const thighGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const thigh = new THREE.Mesh(thighGeo, bodyMat);
            thigh.scale.set(1, 1.4, 1.2);
            group.add(thigh);
            createShells(thighGeo, thigh, true);

            const hock = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), bodyMat);
            hock.position.set(0, -0.4, 0.1);
            group.add(hock);

            const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4), bodyMat);
            lower.position.set(0, -0.6, 0.1);
            lower.rotation.x = -0.1;
            group.add(lower);

            const paw = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), new THREE.MeshStandardMaterial({ color: coatData.legs }));
            paw.scale.set(1.2, 0.5, 1.6);
            paw.position.set(0, -0.78, 0.22);
            group.add(paw);

            group.position.set(x, 0.78, z);
            return group;
        }
        const legL = createLeg(-0.5, 0.4);
        const legR = createLeg(0.5, 0.4);
        corgiGroup.add(legL);
        corgiGroup.add(legR);

        // --- Interaction & Physics ---
        let wiggleAmount = 0, excitement = 0, lastWiggleTime = 0, currentWiggleType = 0;
        let springPos = 0, springVel = 0;
        const K = 160.0, B = 14.0;
        const WIGGLES = [
            { s: 22, a: 0.18 }, { s: 12, a: 0.35 },
            { s: 38, a: 0.12 }, { s: 16, a: 0.3, name: 'hop' }
        ];

        renderer.domElement.addEventListener('mousedown', () => {
            const now = performance.now();
            excitement = (now - lastWiggleTime < 800) ? Math.min(excitement + 0.6, 4.0) : Math.max(excitement * 0.4, 0);
            let next = Math.floor(rand() * WIGGLES.length);
            if (next === currentWiggleType) next = (next + 1) % WIGGLES.length;
            currentWiggleType = next;
            wiggleAmount = 1.0; lastWiggleTime = now;
            springVel += 20.0 * (1.0 + excitement * 0.5);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1), time = clock.getElapsedTime();
            
            wiggleAmount = Math.max(0, wiggleAmount - delta * 1.4);
            excitement = Math.max(0, excitement - delta * 0.5);
            
            const w = WIGGLES[currentWiggleType];
            const amp = (wiggleAmount * w.a) * (1.0 + excitement * 0.8);
            const speed = w.s * (1.0 + excitement * 0.3);
            
            // Damped Spring Physics
            springVel += (-K * springPos - B * springVel) * delta;
            springPos += springVel * delta;
            
            const total = springPos * 0.025 + Math.sin(time * speed) * amp;
            body.rotation.z = total;
            body.position.x = total * 0.45;
            tail.position.x = total * 1.4;
            tail.rotation.z = total * 3.0;

            allFurMaterials.forEach(m => {
                m.uniforms.uTime.value = time;
                m.uniforms.uWiggle.value = Math.abs(total) + amp;
            });

            legL.rotation.z = -total * 0.35;
            legR.rotation.z = -total * 0.35;
            
            let h = 0;
            if (w.name === 'hop' && wiggleAmount > 0.5) {
                h = Math.abs(Math.sin(time * speed)) * 0.18 * wiggleAmount;
                legL.position.y = 0.78 + h * 0.5;
                legR.position.y = 0.78 + h * 0.5;
            } else {
                legL.position.y = 0.78;
                legR.position.y = 0.78;
            }
            corgiGroup.position.y = h + Math.sin(time * 2.2) * 0.006; // Breathing
            corgiGroup.position.x = Math.sin(time * 0.6) * 0.025; // Weight shift

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
