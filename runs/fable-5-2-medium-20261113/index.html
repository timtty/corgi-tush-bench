  const aspect = w / h;
  camera.aspect = aspect;
  camera.fov = aspect >= 1 ? 30 : 2 * Math.atan(Math.tan(15 * RAD) / aspect) / RAD;
  camera.updateProjectionMatrix();
}
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => resize(false)).observe(canvas);
window.addEventListener('resize', () => resize(false));
resize(true);

let lastT = 0, slowAcc = 0, slowN = 0, warm = 0;
function frame_(now) {
  requestAnimationFrame(frame_);
  const rawDt = lastT ? (now - lastT) / 1000 : 1 / 60;
  lastT = now;
  if (rawDt > 0.25) simReady = false;            // tab was hidden: don't let the springs explode
  const dt = clamp(rawDt, 1 / 240, 1 / 20);
  // quality only ever drops, and only after a sustained run of slow frames
  if (!qLock && rawDt < 0.25 && ++warm > 45) {
    slowAcc += rawDt; slowN++;
    if (slowN >= 75) {
      if (slowAcc / slowN > 1 / 43 && qLevel < QUALITY.length - 1) { qLevel++; setShells(QUALITY[qLevel].shells); resize(true); warm = 0; }
      slowAcc = 0; slowN = 0;
    }
  }
  resize(false);
  animate(dt);
  simulate(dt);
  const kk = 1 - Math.exp(-dt * 18);
  view.az += (view.taz - view.az) * kk; view.el += (view.tel - view.el) * kk;
  placeCamera();
  const gu = groundMat.uniforms;
  gu.uPawL.value.set(legs[0].pawNow[0], legs[0].pawNow[2], Math.exp(-legs[0].lift / 1.3));
  gu.uPawR.value.set(legs[1].pawNow[0], legs[1].pawNow[2], Math.exp(-legs[1].lift / 1.3));
  gu.uBody.value.set(pose.px * 0.7, Math.exp(-Math.max(0, pose.py) / 6));
  renderer.render(scene, camera);
}
animate(1 / 60); simulate(1 / 60); placeCamera();
requestAnimationFrame(frame_);

// small read-only handle for embedding pages / testing
window.corgi = {
  seed: SEED, coat: COAT, wiggleNames: WIGGLES.map((w) => w.name),
  get excitement() { return excitement; }, get clicks() { return clickCount; }, get lastWiggle() { return lastType; },
  get quality() { return qLevel; }, get vertices() { return NV; },
  setView(azDeg, elDeg) { view.az = view.taz = azDeg * RAD; view.el = view.tel = clamp(elDeg * RAD, EL_MIN, EL_MAX); },
  wiggle(type) { return triggerWiggle(type); },
  lockQuality(level = 0) { qLock = true; qLevel = clamp(level | 0, 0, QUALITY.length - 1); setShells(QUALITY[qLevel].shells); resize(true); }
};
</script>
