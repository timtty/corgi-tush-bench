function soft(a,b,x){const t=THREE.MathUtils.clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}

const warmWhite=new THREE.Color('#f4eee1');
const tan=new THREE.Color().setRGB(.47+coatWarmth*.07,.205+coatWarmth*.025,.062);

// A smooth implicit union gives a continuous back, two gluteal lobes,
// tucked abdomen and real projecting haunches, without intersecting spheres.

   Object.assign(shader.uniforms,uniforms,{uPart:{value:part}});
    shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\n'+deformation+'\nvarying float vFade;');

const hitMeshes=[];

const bodyGeometry=implicitMesh(bodyField,[-.83,.83,.25,1.52,-1.98,.98],.033,0);
const body=addSkin(bodyGeometry,0);

const innerGeometry=implicitMesh((x,y,z)=>union(
 ellipsoid(x,y,z,0,.945,-.15,.525,.465,.67),

// Instanced, camera-facing curved ribbons: a dense short undercoat plus longer
// tapered guard hairs. No texture, no repeated fur cards, no fur shadow passes.

     vec3 tangent=normalize(iNormal*(.64-.48*t)+iFlow*(.36+.80*t));
     vec3 across=normalize(cross(tangent,normalize(cameraPosition-transformed)));
     transformed+=across*position.x*iShape.y*(1.-t*t)*(.85+.15*sin(t*3.14159));
     vT=t;vAcross=position.x;vFurColor=iColor;vTip=iTip;vFade=${solid?'uInfill':'frontFade(iRoot.z)'};
     vPresence=(iShape.z+1.)*.5;
   `);
   shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>
     varying vec3 vFurColor,vTip;varying float vT,vAcross,vFade,vPresence;`);
   shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>',`
     if(vPresence>vFade*vFade*vFade*vFade)discard;
     diffuseColor.rgb=mix(vFurColor,vTip,smoothstep(.40,1.,vT))*(.94+.09*vT);
     diffuseColor.a*=(1.-smoothstep(.48,1.,abs(vAcross)))*(1.-smoothstep(.80,1.,vT))*vFade*vFade*vFade;
     if(diffuseColor.a<.025)discard;
   `);
   // Lighting follows the dog's skin normal, not the arbitrary facing of a
   // two-sided ribbon. This keeps white fur soft rather than sparkling.
   shader.fragmentShader=shader.fragmentShader.replace('#include <normal_fragment_begin>','#include <normal_fragment_begin>\nnormal=normalize(vNormal);');
 };
 mat.customProgramCacheKey=()=>`corgi-fur-${part}-${solid}`;
 const mesh=new THREE.Mesh(f,mat);mesh.frustumCulled=false;mesh.receiveShadow=true;mesh.renderOrder=3+part;scene.add(mesh);
 return mesh;
}
furGeometry(bodyGeometry,64000,0);
furGeometry(innerGeometry,6000,0,true);
for(const g of legGeometries)furGeometry(g,9000,1);
furGeometry(tailGeometry,2200,2);

// Small toe seams and muted keratin nails are visible from the sides and the
// ground-level view. They are not painted onto the rump-facing heels.
for(const side of [-1,1])for(const offset of [-.087,-.029,.029,.087]){
 const nail=new THREE.Mesh(new THREE.SphereGeometry(1,10,7),new THREE.MeshStandardMaterial({color:'#786b57',roughness:.92}));
 nail.scale.set(.013,.013,.029);nail.position.set(side*.482+offset,.049,-.010);
 const base=nail.position.clone();scene.add(nail);
 nail.userData.base=base;
}

let clickIndex=0,active=null,excitement=0;
let clock=0,last=performance.now(),idleIndex=0,idleStart=0;
const motion=new THREE.Vector4();
const spring=new THREE.Vector3(),springVelocity=new THREE.Vector3(),lastBody=new THREE.Vector3();
let currentHop=0,currentSquash=0;
function trigger(){
 const recipe=recipes[clickIndex++%recipes.length];
 excitement=Math.min(1.6,excitement+.37);
 active={...recipe,start:clock,duration:[1.14,1.93,1.04,1.34][recipe.type]/recipe.speed/(1+excitement*.22),energy:1+excitement*.43,from:motion.clone(),fromHop:currentHop};
}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,time:performance.now(),id:e.pointerId};});
renderer.domElement.addEventListener('pointerup',e=>{
 if(!down||down.id!==e.pointerId)return;
 const distance=Math.hypot(e.clientX-down.x,e.clientY-down.y);const elapsed=performance.now()-down.time;down=null;
 if(distance>7||elapsed>700)return;
 const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
 raycaster.setFromCamera(pointer,camera);
 if(raycaster.intersectObjects(hitMeshes).some(hit=>hit.point.z> -1.38))trigger();
});
renderer.domElement.addEventListener('pointercancel',()=>down=null);
function resize(){
 const w=Math.max(1,document.documentElement.clientWidth),h=Math.max(1,document.documentElement.clientHeight);
 renderer.setSize(w,h);camera.aspect=w/h;
 // Fit the same bounding sphere in either orientation, retaining the 400² default.
 camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad(18))/Math.min(1,w/h)));
 camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(document.documentElement);resize();

function update(dt){
 clock+=dt;excitement*=Math.exp(-dt*.72);
 const idle=idlePhases[idleIndex%idlePhases.length];
 if(clock-idleStart>idle.duration){idleStart=clock;idleIndex++;}
 const it=(clock-idleStart)/idle.duration;
 const lean=idle.lean*Math.sin(Math.PI*it)**2;
 let x=Math.sin(clock*1.35)*.005+lean,roll=Math.sin(clock*1.35+.5)*.006+lean*.4;
 let yaw=Math.sin(clock*.73)*.004,dy=Math.sin(clock*2.08)*.004,hop=0,squash=0;
 if(active){
   const t=(clock-active.start)/active.duration;
   if(t>=1)active=null;
   else {
     const env=Math.sin(Math.PI*t)**.85;
     const a=active.amp*active.energy,sign=active.sign;
     let xx=0,rr=0,yy=0,dd=0;
     if(active.type===0){
       const w=t*Math.PI*6.5+active.phase;
       xx=Math.sin(w)*.083*a*env*sign;rr=Math.sin(w-.42)*.092*a*env*sign;yy=Math.sin(w+.35)*.08*a*env*sign;dd=Math.sin(w*2)*.009*a*env;
     }else if(active.type===1){
       const w=t*Math.PI*3.3+active.phase;
       xx=Math.sin(w)*.13*a*env*sign;rr=Math.sin(w-.65)*.14*a*env*sign;yy=Math.sin(w+.5)*.045*a*env*sign;dd=-Math.abs(Math.sin(w))*.018*a*env;
     }else if(active.type===2){
       const w=t*Math.PI*10+active.phase;
       xx=Math.sin(w+.55)*.052*a*env*sign;rr=Math.sin(w)*.075*a*env*sign;yy=Math.sin(w-.6)*.125*a*env*sign;dd=Math.sin(w*2)*.008*a*env;squash=.032*a*env;
     }else{
       const w=t*Math.PI*4;
       xx=Math.sin(w)*.064*a*env*sign;rr=Math.sin(w-.5)*.076*a*env*sign;yy=Math.sin(w+.8)*.07*a*env*sign;
       const ht=(t-.29)/.31;
       if(ht>0&&ht<1)hop=Math.sin(Math.PI*ht)*.115*a;
       squash=(Math.exp(-(((t-.22)/.075)**2))+Math.exp(-(((t-.63)/.075)**2)))*.045*a;
     }
     const blend=soft(0,.13,t);
     x+=THREE.MathUtils.lerp(active.from.x,xx,blend);roll+=THREE.MathUtils.lerp(active.from.y,rr,blend);yaw+=THREE.MathUtils.lerp(active.from.z,yy,blend);dy+=THREE.MathUtils.lerp(active.from.w,dd,blend);
     hop=THREE.MathUtils.lerp(active.fromHop,hop,blend);
   }
 }
 motion.set(x,roll,yaw,dy);currentHop=hop;currentSquash=squash;
 const bodyPosition=new THREE.Vector3(x+roll*.24,dy+hop-squash,yaw*.32);
 const velocity=bodyPosition.clone().sub(lastBody).multiplyScalar(1/Math.max(dt,.001));
 lastBody.copy(bodyPosition);
 // Stable semi-implicit spring integration; tips trail acceleration and settle
 // after the torso has stopped. Longer breeches have greater spring leverage.
 const target=velocity.multiplyScalar(-.031);
 const steps=Math.max(1,Math.ceil(dt/.008));const h=dt/steps;
 for(let i=0;i<steps;i++){
   springVelocity.addScaledVector(target.clone().sub(spring),150*h);
   springVelocity.multiplyScalar(Math.exp(-16*h));
   spring.addScaledVector(springVelocity,h);
 }
 spring.clampLength(0,.11);
 uniforms.uMotion.value.copy(motion);uniforms.uFur.value.copy(spring);
 uniforms.uTime.value=clock;uniforms.uHop.value=hop;uniforms.uSquash.value=squash;
 bellyContact.position.x=x*.45;
 bellyContact.material.uniforms.opacity.value=.16/(1+hop*3);
 for(const shadow of footContacts){shadow.material.uniforms.opacity.value=.28/(1+hop*5);shadow.scale.setScalar(1+hop*1.4);}
 for(const obj of scene.children)if(obj.userData.base)obj.position.y=obj.userData.base.y+hop;
 controls.update();
 // At high elevations orbit around the back's height; at ground level orbit
 // around the floor. The radius never changes. This keeps the long fading
 // back in frame overhead without raising the low-view camera off the floor.
 const orbitOffset=camera.position.clone().sub(controls.target);
 const elevation=THREE.MathUtils.radToDeg(Math.asin(orbitOffset.y/orbitOffset.length()));
 const orbitHeight=.73*soft(25,60,elevation);
 const orbitDepth=-.24-.22*soft(30,65,elevation);
 camera.position.y+=orbitHeight-controls.target.y;
 camera.position.z+=orbitDepth-controls.target.z;
 controls.target.y=orbitHeight;
 controls.target.z=orbitDepth;
 framingTarget.z=orbitDepth;
 camera.lookAt(framingTarget);
 const cameraOffset=camera.position.clone().sub(controls.target);
 uniforms.uInfill.value=soft(.10,.78,-cameraOffset.z/Math.hypot(cameraOffset.x,cameraOffset.z));
}
function frame(now){
 const dt=THREE.MathUtils.clamp((now-last)/1000,0,.035);last=now;
 update(dt);renderer.render(scene,camera);requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();});
requestAnimationFrame(frame);
</script>
</body>
</html>
